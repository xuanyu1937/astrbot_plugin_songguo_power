name: astrbot_plugin_songguo_power
display_name: 松果 NAS 开关机
desc: 用松果电子开机卡的开放 API，在聊天里控制 NAS/主机的开机、关机、重启与状态查询
short_desc: /nas 状态|开机|关机|重启|强制关机|设备
help: |
  /nas 状态        查询当前是开机还是关机
  /nas 开机        开机
  /nas 关机        关机（需二次确认）
  /nas 重启        重启（需二次确认）
  /nas 强制关机    强制断电（需二次确认）
  /nas 设备        拉取设备列表，核对设备名
  /nas 确认        确认执行挂起的操作
  只有白名单里的用户可以使用。
version: v1.1.1
author: 彭语涵
repo: ""
astrbot_version: ">=4.26.1"
